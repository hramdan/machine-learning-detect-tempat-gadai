[project]
name = "pegadaian-spatial-replit"
version = "0.1.0"
description = "Replit dependency environment for the existing FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.2",
    "fastapi>=0.104.1",
    "geopy>=2.4.1",
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.2",
    "sqlalchemy>=2.0.23",
    "uvicorn[standard]>=0.24.0",
]
