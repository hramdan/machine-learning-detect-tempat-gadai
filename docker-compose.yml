version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: pegadaian_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pegadaian_spatial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pegadaian_spatial}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pegadaian_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pegadaian_backend
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pegadaian_spatial}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - pegadaian_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pegadaian_frontend
    restart: always
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - pegadaian_network

volumes:
  pgdata:
    driver: local

networks:
  pegadaian_network:
    driver: bridge
